# planck_left user config.
#
# NOTE: ZMK loads "<board>.conf", so this file (planck_left.conf) is what
# actually applies to the left board. The old shared "planck.conf" does not
# match either board name and is therefore inert.

# --- USB + web LED control ------------------------------------------------
# Raw HID transport (zmk-raw-hid, usage page 0xFF60) so the companion web page
# can drive the onboard LEDs over WebHID. Needs a second USB HID interface.
CONFIG_ZMK_USB=y
CONFIG_RAW_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2

# Repo-local module: LED control + status indicator.
CONFIG_PLANCK_LED_CONTROL=y
CONFIG_PLANCK_LED_STATUS=y

# --- Battery / connection status (used by the LED status flashes) ---------
CONFIG_ZMK_BATTERY_REPORTING=y

# --- Power / sleep --------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
