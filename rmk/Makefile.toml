[env]
RMK_REVISION = { value = "r2", condition = { env_not_set = ["RMK_REVISION"] } }

[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

[tasks.objcopy-central]
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "central",
    "--no-default-features",
    "--features",
    "hw-${RMK_REVISION}",
    "--",
    "-O",
    "ihex",
    "planck-boy-color-rmk-${RMK_REVISION}-central.hex",
]
dependencies = ["install-llvm-tools", "flip-link"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }

[tasks.objcopy-peripheral]
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "peripheral",
    "--no-default-features",
    "--features",
    "hw-${RMK_REVISION}",
    "--",
    "-O",
    "ihex",
    "planck-boy-color-rmk-${RMK_REVISION}-peripheral.hex",
]
dependencies = ["install-llvm-tools", "flip-link"]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }

[tasks.uf2-central]
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "planck-boy-color-rmk-${RMK_REVISION}-central.hex",
    "--output-path",
    "planck-boy-color-rmk-${RMK_REVISION}-central.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-central"]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
    "hex-to-uf2",
    "--help",
] }

[tasks.uf2-peripheral]
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "planck-boy-color-rmk-${RMK_REVISION}-peripheral.hex",
    "--output-path",
    "planck-boy-color-rmk-${RMK_REVISION}-peripheral.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-peripheral"]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
    "hex-to-uf2",
    "--help",
] }

[tasks.uf2]
dependencies = ["uf2-central", "uf2-peripheral"]
