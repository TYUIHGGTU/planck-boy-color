[keyboard]
name = "PBC R2"
product_name = "PBC R2"
manufacturer = "Modifier Key"
# Development VID/PID. Replace with an assigned pair before distribution.
vendor_id = 0x4C4B
product_id = 0x5042
chip = "nrf52840"
usb_enable = true

[chip.nrf52840]
# The ZMK board configuration enables both regulators, proving that the PCB has
# the required LC network.
dcdc_reg0 = true
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"

[rmk]
ble_profiles_num = 3
combo_max_num = 9
morse_max_num = 3
split_central_sleep_timeout_seconds = 3600

[storage]
enabled = true
# Preserve the nrf52840-nosd partition used by the existing ZMK firmware.
start_addr = 0xD4000
num_sectors = 32

[ble]
enabled = true
battery_adc_pin = "vddh"
default_tx_power = 8
use_2m_phy = true

[layout]
rows = 5
cols = 12
default_variant = "physical"
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L) [2] (0,6,R) (0,7,R) (0,8,R) (0,9,R) (0,10,R) (0,11,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L) [2] (1,6,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R) (1,11,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L) [2] (2,6,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R) (2,11,R)
                 (3,2,L) (3,3,L) (3,4,L) (3,5,L) [2] (3,6,R) (3,7,R) (3,8,R) (3,9,R)
[y=1] (4,0,L) [9] (4,6,R)
"""

# The fifth row contains the two encoder push switches. ZMK aliases these to
# existing matrix positions; RMK keeps them as independent electrical inputs
# with duplicated actions, while hiding them from the rendered key layout.
[[layout.variant]]
name = "physical"
hidden = ["(4,0)", "(4,6)"]

[keymap]
layers = 4

[[keymap.layer]]
name = "LETTER"
keys = """
Escape Q W E R T Y U I O P Backspace
RShift A S D F G H J K L Semicolon Enter
LShift Z X C V B N M Comma Dot Slash Backslash
LCtrl LAlt LGui Space MO(2) MO(1) KbVolumeDown KbVolumeUp
LCtrl KbVolumeUp
"""
encoders = [
    ["AudioVolUp", "AudioVolDown"],
    ["AudioVolDown", "AudioVolUp"],
]

[[keymap.layer]]
name = "CHAR"
keys = """
Escape SHIFTED(Kc1) SHIFTED(Kc2) SHIFTED(Kc3) SHIFTED(Kc4) SHIFTED(Kc5) LCtrl SHIFTED(Kc7) SHIFTED(Kc8) SHIFTED(Kc9) SHIFTED(Kc0) Grave
Tab Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 Enter
LShift Minus Equal SHIFTED(RightBracket) SHIFTED(Kc0) RightBracket SHIFTED(Semicolon) Quote Comma Dot Slash Backslash
_ _ _ _ _ _ _ _
_ _
"""
encoders = [["_", "_"], ["_", "_"]]

[[keymap.layer]]
name = "ARROW"
keys = """
Escape SHIFTED(Kc1) SHIFTED(Kc2) SHIFTED(Kc3) SHIFTED(Kc4) SHIFTED(Kc5) LCtrl PageUp Up PageDown Home Grave
Tab Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Left Down Right End Enter
LShift Minus Equal SHIFTED(LeftBracket) SHIFTED(Kc9) LeftBracket SHIFTED(Semicolon) Quote Comma Dot Slash Backslash
_ _ _ _ _ _ _ _
_ _
"""
encoders = [["_", "_"], ["_", "_"]]

[[keymap.layer]]
name = "BLE"
keys = """
User0 User0 User4 AudioVolUp BrightnessUp No No No No No No No
User1 User1 User3 AudioVolDown BrightnessDown No No No No No No No
User2 User2 User5 KbMute MissionControl No No No No No No No
User5 No No No _ _ No WM(Q, RCtrl | RGui)
User5 WM(Q, RCtrl | RGui)
"""
encoders = [["_", "_"], ["_", "_"]]

[behavior.combo]
timeout = "50ms"
combos = [
    { actions = ["MO(2)", "MO(1)"], output = "MO(3)", layer = 0 },
    { actions = ["R", "E"], output = "WM(Up, LCtrl)", layer = 0 },
    { actions = ["U", "I"], output = "WM(Up, LCtrl)", layer = 0 },
    { actions = ["S", "A"], output = "WM(Left, LCtrl)", layer = 0 },
    { actions = ["K", "J"], output = "WM(Left, LCtrl)", layer = 0 },
    { actions = ["F", "D"], output = "WM(Right, LCtrl)", layer = 0 },
    { actions = ["L", "Semicolon"], output = "WM(Right, LCtrl)", layer = 0 },
    { actions = ["C", "V"], output = "WM(Down, LCtrl)", layer = 0 },
    { actions = ["M", "Comma"], output = "WM(Down, LCtrl)", layer = 0 },
]

[behavior.morse]
hold_timeout = "150ms"
gap_timeout = "200ms"
prior_idle_time = "0ms"

[behavior.morse.profiles]
space_cmd = { hold_timeout = "150ms", gap_timeout = "150ms" }

[[behavior.morse.morses]]
tap_actions = ["SHIFTED(LeftBracket)", "SHIFTED(RightBracket)"]

[[behavior.morse.morses]]
tap_actions = ["LeftBracket", "RightBracket"]

[[behavior.morse.morses]]
tap_actions = ["SHIFTED(Kc9)", "SHIFTED(Kc0)"]

[split]
connection = "ble"

[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
battery_adc_pin = "vddh"
battery_user_description = "Left"

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
bootmagic = [0, 0]
direct_pins = [
    ["P0_28", "P0_05", "P0_04", "P0_21", "P0_19", "P0_16"],
    ["P0_27", "P0_25", "P0_23", "P0_14", "P0_13", "P0_15"],
    ["P0_30", "P0_03", "P1_12", "P1_11", "P1_05", "P1_13"],
    ["_",     "_",     "P0_29", "P0_02", "P1_15", "P1_10"],
    ["P0_31", "_",     "_",     "_",     "_",     "_"],
]

[[split.central.input_device.encoder]]
pin_a = "P1_02"
pin_b = "P1_07"
internal_pullup = true
phase = "resolution"
resolution = { detent = 30, pulse = 15 }
debounce_ms = 5

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
battery_adc_pin = "vddh"
battery_user_description = "Right"

[split.peripheral.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
bootmagic = [0, 0]
direct_pins = [
    ["P1_10", "P1_13", "P1_15", "P0_02", "P0_29", "P0_31"],
    ["P1_11", "P0_26", "P0_04", "P0_06", "P0_08", "P1_09"],
    ["P1_04", "P1_01", "P0_20", "P0_07", "P1_08", "P0_11"],
    ["P1_02", "P1_00", "P0_17", "P0_15", "_",     "_"],
    ["P0_13", "_",     "_",     "_",     "_",     "_"],
]

[[split.peripheral.input_device.encoder]]
pin_a = "P0_24"
pin_b = "P0_22"
internal_pullup = true
phase = "resolution"
resolution = { detent = 30, pulse = 15 }
debounce_ms = 5
